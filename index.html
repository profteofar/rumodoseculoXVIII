<style>
/* Layout: faixa de navegação + coluna central de leitura (max 920px); níveis como cores hipsométricas de um mapa de relevo */
:root{
  --bg:#f2f5f3; --paper:#ffffff; --ink:#1d2a2c; --muted:#5b6b6a; --line:#d5dfdb;
  --sea:#1e5b86; --sea-soft:#e3eef6; --gold:#b8860b;

  --lv-b:#c9952c; --lv-b-soft:#f7ecd3;
  --lv-a:#8a5436; --lv-a-soft:#f1e3da;
  --ok:#2f7d4a; --ok-soft:#e2f2e7; --bad:#b23a3a; --bad-soft:#f8e3e1; --warn:#9a6a00;
  --f-display:"Alegreya","Iowan Old Style","Palatino Linotype",Georgia,serif;
  --f-body:"Alegreya Sans","Segoe UI","Helvetica Neue",Arial,sans-serif;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#131b1d; --paper:#1b2528; --ink:#e6ece9; --muted:#9aaaa7; --line:#304044;
  --sea:#7db4dc; --sea-soft:#1d3240; --gold:#e0b44a;
  --lv-c:#86c070; --lv-c-soft:#22331d; --lv-b:#e2b350; --lv-b-soft:#3a2f17; --lv-a:#d39874; --lv-a-soft:#3b2820;
  --ok:#6cc28a; --ok-soft:#1c3324; --bad:#ec8a84; --bad-soft:#3d2120; --warn:#e3b04b; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#131b1d; --paper:#1b2528; --ink:#e6ece9; --muted:#9aaaa7; --line:#304044;
  --sea:#7db4dc; --sea-soft:#1d3240; --gold:#e0b44a;
  --lv-c:#86c070; --lv-c-soft:#22331d; --lv-b:#e2b350; --lv-b-soft:#3a2f17; --lv-a:#d39874; --lv-a-soft:#3b2820;
  --ok:#6cc28a; --ok-soft:#1c3324; --bad:#ec8a84; --bad-soft:#3d2120; --warn:#e3b04b; color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:17px;line-height:1.55}
img{max-width:100%}
[hidden]{display:none!important}
h1,h2,h3,h4{font-family:var(--f-display);line-height:1.2;text-wrap:balance;margin:0}
h1{font-size:2.1rem}h2{font-size:1.6rem}h3{font-size:1.25rem}
p{margin:0}
a{color:var(--sea)}
button{font:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--sea);outline-offset:2px}
.wrap{max-width:920px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
/* topo */
header.top{background:var(--paper);border-bottom:1px solid var(--line);position:sticky;top:env(safe-area-inset-top,0px);z-index:20}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:21;background:var(--paper)}
.top .wrap{display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding-block:8px}
.brand{font-family:var(--f-display);font-weight:700;font-size:1.15rem;display:flex;align-items:center;gap:8px;white-space:nowrap}
.brand svg{flex:none}
nav.tabs{display:flex;gap:4px;flex-wrap:wrap;margin-left:auto}

main{padding-block:22px 60px}
.view{display:flex;flex-direction:column;gap:20px}
.muted{color:var(--muted)}
.small{font-size:.9rem}
.eyebrow{text-transform:uppercase;letter-spacing:.08em;font-size:.75rem;font-weight:700;color:var(--muted)}
.card{background:var(--paper);border:1px solid var(--line);border-radius:var(--r);padding:18px}
.stack{display:flex;flex-direction:column;gap:12px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px}
.btn{border:1px solid var(--sea);background:var(--sea);color:var(--paper);padding:9px 16px;border-radius:8px;font-weight:700}
.btn.ghost{background:transparent;color:var(--sea)}
.btn.quiet{border-color:var(--line);background:transparent;color:var(--muted);font-weight:600}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.sm{padding:5px 11px;font-size:.9rem}
input[type=text],input[type=email],input[type=url],textarea,select{font:inherit;color:var(--ink);background:var(--paper);border:1px solid var(--line);border-radius:7px;padding:8px 10px;max-width:100%}
textarea{width:100%;min-height:110px;resize:vertical}
label.f{display:flex;flex-direction:column;gap:4px;font-weight:600;font-size:.95rem;flex:1 1 220px;min-width:0}
/* hero */
.hero{display:grid;grid-template-columns:1.3fr 1fr;gap:22px;align-items:center}
.hero h1{font-size:2.5rem}
.hero .lead{font-size:1.15rem;color:var(--muted);margin-top:8px}
.hero figure{margin:0}
.hero img{border-radius:var(--r);display:block}
.hero figcaption{font-size:.8rem;color:var(--muted);margin-top:4px}
@media (max-width:700px){.hero{grid-template-columns:1fr}.hero h1{font-size:2rem}}
.areas{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.area{display:flex;flex-direction:column;gap:6px;text-align:left;background:var(--paper);border:1px solid var(--line);border-radius:var(--r);padding:16px;color:var(--ink)}
.area:hover{border-color:var(--sea)}
.area b{font-family:var(--f-display);font-size:1.2rem}
.who{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.linkish{border:0;background:none;color:var(--muted);text-decoration:underline;padding:0;font-size:.85rem}
/* perfil de relevo */
.profile{background:var(--paper);border:1px solid var(--line);border-radius:var(--r);padding:12px 12px 4px;overflow-x:auto}
.profile svg{display:block;width:100%;min-width:560px;height:auto}
.profile text{font-family:var(--f-body);fill:var(--ink)}
.profile .lbl{font-size:13px;font-weight:700}
.profile .alt{font-size:11px;fill:var(--muted)}
.mk{cursor:pointer}
.mk circle{stroke:var(--paper);stroke-width:3}
.mk.locked{cursor:not-allowed;opacity:.45}
.mk text{font-size:11px;font-weight:700;fill:var(--paper)}
.levels{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:14px}
.lvcard{border-top:6px solid var(--lvc);display:flex;flex-direction:column;gap:10px}
.lvcard h3 span{font-family:var(--f-body);font-size:.85rem;color:var(--muted);font-weight:600;display:block}
.stagelist{display:flex;flex-direction:column;gap:6px}
.stagebtn{display:flex;gap:10px;align-items:center;text-align:left;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:8px;padding:8px 10px}
.stagebtn:disabled{opacity:.5;cursor:not-allowed}
.stagebtn .dot{width:26px;height:26px;border-radius:50%;flex:none;display:grid;place-items:center;font-size:.8rem;font-weight:700;color:var(--paper);background:var(--lvc)}
.stagebtn .st{margin-left:auto;font-size:.8rem;color:var(--muted);white-space:nowrap}
.bar{height:8px;background:var(--line);border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--lvc,var(--sea));border-radius:99px}
.lock{font-size:.85rem;color:var(--muted)}
/* etapa */
.stagehead{border-left:6px solid var(--lvc);padding-left:14px}
.learn{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media (max-width:700px){.learn{grid-template-columns:1fr}}
.learn .card h4{font-size:1.05rem;margin-bottom:6px;display:flex;gap:8px;align-items:center}
.learn .concept{grid-column:1/-1}
.concept p+p{margin-top:8px}
dl.terms{margin:0;display:flex;flex-direction:column;gap:6px}
dl.terms dt{font-weight:700;display:inline}
dl.terms dd{margin:0;display:inline}
ul.mis{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:4px}
.ex{background:var(--paper);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:12px}
.ex .qn{display:flex;gap:10px;align-items:flex-start}
.ex .qn .n{flex:none;font-family:var(--f-display);font-weight:700;color:var(--paper);background:var(--lvc,var(--sea));border-radius:6px;min-width:30px;text-align:center;padding:1px 6px}
.ex .qn > div{min-width:0}
.ex.done-ok{border-color:var(--ok)}
.ex.done-part{border-color:var(--warn)}
.ex.done-bad{border-color:var(--bad)}
.figs{display:flex;gap:10px;flex-wrap:wrap}
.figs figure{margin:0;flex:1 1 220px;max-width:520px}
.figs img{display:block;border-radius:8px;max-height:340px;object-fit:contain;background:var(--bg)}
.figs figcaption{font-size:.8rem;color:var(--muted)}
.opts{display:flex;flex-direction:column;gap:6px}
.opt{display:flex;gap:10px;align-items:flex-start;text-align:left;border:1px solid var(--line);background:var(--bg);color:var(--ink);padding:9px 12px;border-radius:8px}
.opt .box{flex:none;width:20px;height:20px;border:2px solid var(--muted);border-radius:50%;margin-top:2px}
.opt.multi .box{border-radius:4px}
.opt[aria-pressed="true"]{border-color:var(--sea);background:var(--sea-soft)}
.opt[aria-pressed="true"] .box{background:var(--sea);border-color:var(--sea)}
.opt.ok{border-color:var(--ok);background:var(--ok-soft)}
.opt.bad{border-color:var(--bad);background:var(--bad-soft)}
.opt.miss{border-color:var(--ok);border-style:dashed}
.fb{border-radius:8px;padding:10px 12px;font-size:.95rem}
.fb.ok{background:var(--ok-soft);border:1px solid var(--ok)}
.fb.part{background:var(--lv-b-soft);border:1px solid var(--warn)}
.fb.bad{background:var(--bad-soft);border:1px solid var(--bad)}
.fb b.h{display:block}
.tfrow{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center;border-bottom:1px dashed var(--line);padding-block:6px}
.tfrow .fix{grid-column:1/-1;font-size:.9rem;color:var(--muted)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{border:0;background:var(--bg);color:var(--ink);padding:5px 12px;font-weight:700}
.seg button+button{border-left:1px solid var(--line)}
.seg button[aria-pressed="true"]{background:var(--sea);color:var(--paper)}
.seg button.ok{background:var(--ok);color:var(--paper)}
.seg button.bad{background:var(--bad);color:var(--paper)}
.match{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media (max-width:560px){.match{grid-template-columns:1fr}}
.match .col{display:flex;flex-direction:column;gap:6px;min-width:0}
.mitem{text-align:left;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:8px;padding:8px 10px;display:flex;gap:8px;align-items:center}
.mitem .tag{flex:none;min-width:24px;height:24px;border-radius:50%;display:grid;place-items:center;font-size:.8rem;font-weight:700;background:var(--line);color:var(--ink)}
.mitem.sel{border-color:var(--sea);box-shadow:0 0 0 2px var(--sea-soft)}
.mitem.ok{border-color:var(--ok)} .mitem.bad{border-color:var(--bad)}
.fill{line-height:2.3}
.fill select,.fill input{padding:3px 6px;margin:0 2px;max-width:200px}
.fill .ok{border-color:var(--ok);background:var(--ok-soft)} .fill .bad{border-color:var(--bad);background:var(--bad-soft)}
.bank{display:flex;gap:6px;flex-wrap:wrap}
.bank span{border:1px dashed var(--muted);border-radius:6px;padding:1px 8px;font-size:.9rem}
.hot{position:relative;display:block;width:fit-content;max-width:100%;align-self:flex-start;line-height:0;cursor:crosshair}
.hot img{display:block;border-radius:8px;max-height:none;width:auto;max-width:100%}
.hot .rg{position:absolute;border:2px solid var(--sea);background:color-mix(in srgb,var(--sea) 22%,transparent);border-radius:6px;display:grid;place-items:center;line-height:1.1;font-size:.8rem;font-weight:700;color:var(--ink);pointer-events:none;text-align:center}
.hot .rg span{background:var(--paper);padding:1px 5px;border-radius:4px}
.hot .rg.ok{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 25%,transparent)}
.hot .rg.bad{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 25%,transparent)}
.hot .rg.miss{border-style:dashed;border-color:var(--ok);background:transparent}
.hot .pin{position:absolute;width:30px;height:30px;margin:-15px 0 0 -15px;border-radius:50%;border:3px solid var(--paper);display:grid;place-items:center;font-size:.75rem;font-weight:700;color:var(--paper);line-height:1;pointer-events:none}
.seqlist{display:flex;flex-direction:column;gap:4px}
.seqlist div{padding:4px 8px;border-radius:6px}
.seqlist .cur{background:var(--sea-soft);font-weight:700}
.imgpick{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.imgpick button{border:3px solid transparent;background:var(--bg);border-radius:10px;padding:4px;display:flex;flex-direction:column;gap:4px;color:var(--ink);font-weight:700;font-size:.85rem}
.imgpick img{width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:7px;display:block}
.imgpick button[aria-pressed="true"]{border-color:var(--sea)}
.imgpick button.ok{border-color:var(--ok)} .imgpick button.bad{border-color:var(--bad)} .imgpick button.miss{border-color:var(--ok);border-style:dashed}
.sortrow{display:flex;gap:8px;align-items:center;flex-wrap:wrap;border-bottom:1px dashed var(--line);padding-block:6px}
.sortrow > span:first-child{flex:1 1 200px;min-width:0}
.sortrow.ok > span:first-child::after{content:" ✓";color:var(--ok);font-weight:700}
.sortrow.bad > span:first-child::after{content:" ✗";color:var(--bad);font-weight:700}
.olist{display:flex;flex-direction:column;gap:6px}
.oitem{display:flex;gap:8px;align-items:center;border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:6px 8px}
.oitem .num{font-weight:700;min-width:22px}
.oitem .t{flex:1;min-width:0}
.oitem button{border:1px solid var(--line);background:var(--paper);color:var(--ink);border-radius:6px;width:34px;height:30px}
.oitem.ok{border-color:var(--ok)} .oitem.bad{border-color:var(--bad)}
.gridq{display:flex;flex-direction:column;gap:10px}
.gridq .gr{display:flex;flex-direction:column;gap:6px}
.gridq .gr .chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:999px;padding:4px 12px;font-weight:600}
.chip[aria-pressed="true"]{background:var(--sea);border-color:var(--sea);color:var(--paper)}
.chip.ok{background:var(--ok);border-color:var(--ok);color:var(--paper)}
.chip.bad{background:var(--bad);border-color:var(--bad);color:var(--paper)}
.chip.miss{border-color:var(--ok);border-style:dashed}
.kwlist{margin:4px 0 0;padding-left:18px}
.kwlist li.got{color:var(--ok)} .kwlist li.no{color:var(--bad)}
.recap{border-left:6px solid var(--lvc);background:var(--paper)}
.recap ul{margin:6px 0 0;padding-left:20px;display:flex;flex-direction:column;gap:4px}
.pill{display:inline-block;padding:2px 10px;border-radius:999px;font-size:.8rem;font-weight:700;background:var(--sea-soft);color:var(--sea)}
.pill.ok{background:var(--ok-soft);color:var(--ok)} .pill.bad{background:var(--bad-soft);color:var(--bad)} .pill.warn{background:var(--lv-b-soft);color:var(--warn)}
/* lab */
.labsteps{display:flex;gap:6px}
.labsteps i{flex:1;height:6px;border-radius:99px;background:var(--line)}
.labsteps i.on{background:var(--sea)} .labsteps i.okk{background:var(--ok)}
.analogy{background:var(--sea-soft);border-radius:8px;padding:10px 12px;font-weight:600}
/* teste */
.tprog{display:flex;gap:3px}
.tprog i{flex:1;height:8px;border-radius:3px;background:var(--line)}
.tprog i.d{background:var(--sea)} .tprog i.c{background:var(--ink)}
.tag{font-size:.75rem;font-weight:700;padding:2px 8px;border-radius:999px;background:var(--bg);border:1px solid var(--line);color:var(--muted)}
.tag.dC{color:var(--lv-c);border-color:var(--lv-c)} .tag.dB{color:var(--warn);border-color:var(--lv-b)} .tag.dA{color:var(--lv-a);border-color:var(--lv-a)}
.score{font-family:var(--f-display);font-size:3rem;font-weight:700;line-height:1;font-variant-numeric:tabular-nums}
.cbars{display:flex;flex-direction:column;gap:8px}
.cbar{display:grid;grid-template-columns:minmax(120px,240px) 1fr 52px;gap:10px;align-items:center;font-size:.95rem}
.cbar .bar i{background:var(--c)}
.cbar b{text-align:right;font-variant-numeric:tabular-nums}
@media (max-width:520px){.cbar{grid-template-columns:1fr 52px}.cbar .bar{grid-column:1/-1;grid-row:2}}
.errs{display:flex;flex-direction:column;gap:10px}
.err{border-left:4px solid var(--bad);padding:6px 12px;background:var(--paper);border-radius:0 8px 8px 0}
.plan{counter-reset:p;display:flex;flex-direction:column;gap:8px;margin:0;padding:0;list-style:none}
.plan li{display:flex;gap:10px;align-items:flex-start;flex-wrap:wrap}
.plan li > div{flex:1 1 260px;min-width:0}
/* glossário */
.gl{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:10px}
.gl div{background:var(--paper);border:1px solid var(--line);border-radius:8px;padding:10px 12px}
.gl b{font-family:var(--f-display);font-size:1.05rem;display:block}
/* professor */
.prof h3{margin-top:6px}
.prof section{display:flex;flex-direction:column;gap:10px}
.prof ul,.prof ol{margin:0;padding-left:22px;display:flex;flex-direction:column;gap:5px}
.prof table{border-collapse:collapse;width:100%;font-size:.95rem}
.prof th,.prof td{border:1px solid var(--line);padding:6px 8px;text-align:left;vertical-align:top}
.prof th{background:var(--bg)}
.tablewrap{overflow-x:auto}
pre.code{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:12px;overflow-x:auto;font-size:.82rem;line-height:1.4;max-height:360px}
.status{font-size:.9rem;font-weight:600}
.status.ok{color:var(--ok)} .status.bad{color:var(--bad)}
.gate{max-width:520px}
@media (prefers-reduced-motion:no-preference){.ex,.card{transition:border-color .2s}}

</style>

   equivocos:["Uma obra pode ser barroca sem ter sido mandada fazer pelo rei (Torre dos Clérigos, Casa de Mateus).","D. João V reinou no século XVIII, não no XVI."],

    {id:"b2a", type:"tf", q:"Classifica cada afirmação como verdadeira (V) ou falsa (F).", items:[{t:"D. João V reinou no século XVI.",v:false,fix:"Reinou no século XVIII (1706–1750).",mis:"m_seculo"},{t:"A corte de D. João V era rica e luxuosa.",v:true},{t:"D. João V foi um rei absoluto.",v:true},{t:"A origem da riqueza de D. João V eram as especiarias do Oriente.",v:false,fix:"A riqueza vinha do ouro e dos diamantes do Brasil.",mis:"m_oriente"}]},
    {id:"b2b", type:"imgpick", q:"Seleciona as obras construídas por ordem de D. João V.", imgs:[{src:"mafra.jpg",cap:"Fig. 3"},{src:"torre-clerigos.jpg",cap:"Fig. 4"},{src:"aqueduto.jpg",cap:"Fig. 5"},{src:"casa-mateus.jpg",cap:"Fig. 6"},{src:"biblioteca-joanina.jpg",cap:"Fig. 7"}], ans:[0,2,4], mis:{1:"m_obras",3:"m_obras"}, exp:"Fig. 3 Mafra, Fig. 5 Aqueduto das Águas Livres, Fig. 7 Biblioteca Joanina. A Torre dos Clérigos (Nasoni) e a Casa de Mateus são barrocas, mas não foram mandadas fazer pelo rei."},

    {id:"b2d", type:"open", q:"Indica <b>duas características</b> do estilo barroco.", img:"igreja-sao-francisco-porto.jpg", groups:[{n:"muita decoração",k:["decora","ornament","exuberan","excesso","exager","horror ao vazio","rebusc"]},{n:"talha dourada",k:["talha","dourad","ouro"]},{n:"curvas e contracurvas",k:["curva","movimento","ondula"]},{n:"colunas torsas",k:["torsa","torcid","espiral","salomon"]},{n:"luz e sombra",k:["luz","sombra"]},{n:"azulejos e mármores",k:["azulej","marmor"]}], min:2, model:"Uso de muitos elementos decorativos; decoração com talha dourada; curvas e contracurvas; colunas torsas; jogos de luz e sombra."}

  {id:"B3", t:"Clero, nobreza e povo",
   conceito:"<p>A sociedade estava organizada em três <b>ordens</b>: o <b>clero</b> (oração, ensino, assistência aos pobres e doentes), a <b>nobreza</b> (guerra, defesa do império, governação) e o <b>povo</b> (trabalho e impostos).</p><p>Dentro do povo, a <b>burguesia</b> enriquecia com o comércio e procurava <b>imitar a nobreza</b>. Um burguês só podia tornar-se nobre <b>por determinação do rei</b>, que lhe dava um título.</p>",
   termos:[["Ordem (estado)","cada um dos três grandes grupos da sociedade."],["Burguesia","grupo do povo que enriquecia com o comércio."],["Título nobiliárquico","distinção dada pelo rei (barão, visconde, conde…)."],["Tribunal do Santo Ofício","outro nome da Inquisição."]],
   exemplo:"Um comerciante rico de Lisboa podia comprar um palácio, vestir-se como um conde e ir à ópera, mas continuava a pagar impostos até o rei o fazer nobre.",
   equivocos:["A burguesia não era uma quarta ordem privilegiada: fazia parte do povo.","Não era só o nascimento que contava: o rei podia nobilitar quem lhe prestasse serviços."],
   ex:[
    {id:"b3a", type:"match", q:"Relaciona cada grupo social com a descrição certa. Há duas descrições a mais.", img:"corte-d-joao-v.jpg", left:["Clero","Nobreza","Burguesia","Povo"], right:["Dedicava-se à assistência e à oração","Trabalhava no comércio, na guerra e na oração","Dedicava-se à defesa do império","Vivia com muitas dificuldades","Procurava imitar a nobreza","Grupo privilegiado que se dedicava à agricultura"], ans:[0,2,4,3], exp:"1–a, 2–c, 3–e, 4–d."},
    {id:"b3b", type:"choice", q:"No século XVIII, os membros da burguesia podiam ascender à nobreza…", opts:["com a riqueza do comércio ultramarino","por determinação régia","por nascimento","com uma formação universitária"], ans:1, mis:{0:"m_nascimento",2:"m_nascimento"}, exp:"Só o rei podia dar títulos de nobreza. A riqueza ajudava, mas não bastava."},
    {id:"b3c", type:"choice", q:"A cerimónia representada é um…", img:"auto-de-fe.jpg", opts:["auto de fé","julgamento judaico","julgamento cristão","castigo público"], ans:0, exp:"Auto de fé: leitura pública das sentenças da Inquisição."},
    {id:"b3d", type:"choice", q:"As principais vítimas dessa cerimónia eram:", opts:["muçulmanos","judeus","cristãos-novos","cristãos-velhos"], ans:2, mis:{0:"m_vitimas",1:"m_vitimas"}, exp:"Os judeus tinham sido obrigados a converter-se em 1497; os seus descendentes, os cristãos-novos, eram vigiados pela Inquisição."},
    {id:"b3e", type:"imgpick", q:"Estas figuras representam os grupos sociais. Seleciona as que pertencem a grupos <b>privilegiados</b>.", imgs:[{src:"nobreza.jpg",cap:"A"},{src:"clero.jpg",cap:"B"},{src:"burguesia.jpg",cap:"C"},{src:"povo.jpg",cap:"D"}], ans:[0,1], mis:{2:"m_burguesia"}, exp:"A: nobre; B: membro do clero. C (burguês) e D (povo) pagavam impostos."}
   ]},
  {id:"B4", t:"Reconstruir Lisboa",
   conceito:"<p>Depois do terramoto, o ministro tomou <b>medidas imediatas</b>: enterrar os mortos (para evitar epidemias), cuidar dos feridos, <b>policiar as ruas</b> para evitar roubos e planear a reconstrução.</p><p>Governou com poderes enormes e fez <b>reformas</b> em três áreas: <b>economia</b> (companhias comerciais, indústrias), <b>sociedade</b> (limitar o poder do clero e da nobreza, apoiar a burguesia) e <b>ensino</b> (escolas menores, Aula do Comércio, reforma da Universidade de Coimbra).</p>",
   termos:[["Companhia comercial","empresa com o exclusivo de um comércio (ex.: vinho do Douro)."],["Escolas menores","escolas onde se aprendia a ler, escrever e contar."],["Aula do Comércio","escola para formar comerciantes."],["Reforma","mudança organizada para melhorar alguma coisa."]],
   exemplo:"A Companhia das Vinhas do Alto Douro (1756) criou a primeira região demarcada de vinho: ainda hoje o vinho do Porto só pode vir dessa região.",
   equivocos:["As reformas não foram só na cidade: mexeram na economia, na sociedade e no ensino de todo o país.","Rei: D. José I. Ministro: Sebastião José de Carvalho e Melo (Marquês de Pombal)."],
   ex:[
    {id:"b4a", type:"grid", q:"Completa o quadro: em cada linha escolhe a resposta certa (na linha das calamidades escolhe três).", img:"lisboa-final-seculo-xviii.jpg", rows:["Ano da destruição de Lisboa","Calamidades que destruíram Lisboa","Rei que governava Portugal","Ministro responsável pela reconstrução"], cols:[["1706","1750","1755","1759"],["Terramoto","Maremoto","Incêndios","Peste","Guerra"],["D. João V","D. José I","D. Maria I","D. Pedro II"],["Marquês de Pombal","Padre António Vieira","Nicolau Nasoni","Duque de Aveiro"]], ans:[[2],[0,1,2],[1],[0]], exp:"1755; terramoto, maremoto e incêndios; D. José I; Sebastião José de Carvalho e Melo, Marquês de Pombal."},
    {id:"b4b", type:"open", q:"Indica <b>duas medidas</b> tomadas logo após a destruição de Lisboa.", groups:[{n:"enterrar os mortos",k:["enterr","sepult","mortos","cadaver"]},{n:"cuidar dos vivos/feridos",k:["cuidar","ferid","vivos","tratar","alimenta","abrig"]},{n:"policiar as ruas / evitar roubos",k:["polic","roub","saque","pilha","ordem","vigi"]},{n:"planear a reconstrução",k:["reconstru","planta","plano","limpar","entulho"]}], min:2, model:"Enterrar os mortos e cuidar dos vivos; policiar as ruas para evitar roubos; planear a reconstrução."},
    {id:"b4c", type:"open", q:"A partir da imagem, refere <b>duas características</b> da Lisboa pombalina.", img:"lisboa-pombalina.jpg", groups:[{n:"ruas largas e retas/perpendiculares",k:["larga","reta","retilin","paralel","perpendic","geometr","xadrez","grelha","cruz"]},{n:"prédios da mesma altura / fachadas iguais",k:["mesma altura","altura","iguais","identic","semelhan","fachada","nivelad"]},{n:"Praça do Comércio junto ao rio",k:["praca","comercio","rio","tejo"]},{n:"edifícios antissísmicos (gaiola)",k:["antissism","anti-sism","antisism","gaiola","sismo","resist"]},{n:"esgotos e passeios",k:["esgoto","passeio","calcad","iluminac"]}], min:2, model:"Ruas largas e perpendiculares; edifícios com fachadas idênticas e a mesma altura; sistema antissísmico de gaiola; Praça do Comércio junto ao rio; rede de esgotos."},
    {id:"b4d", type:"sort", q:"Completa o esquema das medidas do Marquês de Pombal: classifica cada medida.", cats:["Económicas","Sociais","Educativas"], items:[{t:"Criação de companhias comerciais",c:0},{t:"Criação de novas indústrias",c:0},{t:"Demarcação da região do vinho do Porto",c:0},{t:"Limitação do poder do clero e da nobreza",c:1},{t:"Apoio à burguesia",c:1},{t:"Fim da distinção entre cristãos-novos e cristãos-velhos",c:1},{t:"Criação das escolas menores",c:2},{t:"Reforma da Universidade de Coimbra",c:2},{t:"Criação da Aula do Comércio",c:2}], exp:"Económicas: companhias, indústrias, Douro. Sociais: limitar clero e nobreza, apoiar a burguesia, fim da distinção entre cristãos. Educativas: escolas menores, Aula do Comércio, Colégio dos Nobres, Universidade."}
   ]}
  ],
  recap:["Territórios por continente: Europa, África, Ásia e América (Brasil).","Engenho: casa grande, sanzala, canavial e a fábrica do açúcar.","O quinto: 1/5 do ouro era do rei; o ouro era fundido em barras marcadas.","Rei absoluto: governa sem Cortes e tem todos os poderes.","Barroco: decoração abundante, curvas, colunas torsas, talha dourada, azulejos.","Burguesia: rica, parte do povo, imitava a nobreza; só o rei a podia nobilitar.","Pombal: medidas imediatas após 1755 e reformas económicas, sociais e educativas."],
  mini:[
   {id:"mb1", type:"choice", q:"O que era o «quinto»?", opts:["Um imposto: 1/5 do ouro era do rei","O quinto rei da dinastia","Um tipo de moeda","Uma região do Brasil"], ans:0, mis:{}, exp:"O rei ficava com a quinta parte do ouro extraído."},
   {id:"mb2", type:"choice", q:"Porque é que o ouro era fundido em barras com o escudo real?", opts:["Para ficar mais bonito","Para evitar o contrabando e garantir o imposto","Para ser mais leve","Para enviar para a Índia"], ans:1, exp:"As barras marcadas mostravam que o quinto tinha sido pago."},
   {id:"mb3", type:"tf", q:"Verdadeiro ou falso?", items:[{t:"A burguesia era um grupo privilegiado.",v:false,fix:"Fazia parte do povo e pagava impostos.",mis:"m_burguesia"},{t:"O clero dedicava-se ao culto, ao ensino e à assistência.",v:true}]},
   {id:"mb4", type:"choice", q:"Qual destas é uma medida <b>económica</b> do Marquês de Pombal?", opts:["Reforma da Universidade de Coimbra","Criação da Companhia das Vinhas do Alto Douro","Criação das escolas menores","Expulsão dos jesuítas"], ans:1, exp:"A Companhia do Douro organizou o comércio do vinho do Porto."},
   {id:"mb5", type:"choice", q:"Qual destas obras é barroca mas <b>não</b> foi mandada construir por D. João V?", opts:["Palácio-Convento de Mafra","Aqueduto das Águas Livres","Torre dos Clérigos","Biblioteca Joanina"], ans:2, mis:{}, exp:"A Torre dos Clérigos, no Porto, é obra de Nicolau Nasoni para a Irmandade dos Clérigos."}
  ]},
 {id:"A", nome:"Montanha", sub:"Nível A · analisar e argumentar", cor:"var(--lv-a)", alt:"mais de 700 m",
  intro:"Chegaste à montanha. Aqui escreves respostas completas, interpretas mapas, gráficos e textos e defines conceitos com rigor.",
  etapas:[
  {id:"A1", t:"Ler o império em mapas e fontes",
   conceito:"<p>No século XVII, durante o <b>domínio filipino</b> (1580–1640), os inimigos de Espanha (<b>Holanda, Inglaterra e França</b>) atacaram os territórios portugueses. O Oriente ficou em <b>crise</b>: concorrência europeia, <b>ataques de piratas</b> e <b>naufrágios</b>. Por isso os portugueses viraram-se para o comércio no <b>oceano Atlântico</b> e para o <b>Brasil</b>.</p><p>A exploração do Brasil provocou grandes <b>movimentos de população</b>: colonos e missionários portugueses partiram para lá e milhões de africanos foram levados à força. É por isso que o Brasil de hoje tem uma população tão diversa.</p>",
   termos:[["Domínio filipino","período (1580–1640) em que os reis de Espanha governaram Portugal."],["Migração","deslocação de pessoas de uma região para outra."],["Migração forçada","deslocação contra a vontade, como o tráfico de pessoas escravizadas."],["Legenda","explicação das cores e símbolos de um mapa."]],
   exemplo:"Numa fotografia da seleção brasileira de futebol vês jogadores com tons de pele diferentes: é o resultado de séculos de encontro entre europeus, africanos e indígenas.",
   equivocos:["Num mapa, cada cor da legenda conta uma história diferente: lê sempre a legenda antes de responder.","Os portugueses não abandonaram o Oriente: continuaram em Goa, Macau e Timor, mas com menos lucros."],
   ex:[
    {id:"a1a", type:"fill", typed:true, q:"Escreve as palavras que faltam (podes escrever sem acentos).", text:"No século XVII, o Império Português distribuía-se por vários continentes: {0}, {1}, {2} e {3}. Porém, o Império Português do Oriente enfrentou uma grave {4}, devido à concorrência de outros países europeus, tais como a {5}, a {6} e a {7}. Os portugueses também tinham grandes prejuízos devido a ataques {8}, assim como aos {9} provocados por tempestades. Por essa razão, transferiram as suas atenções para o comércio no oceano {10} e o {11} tornou-se a principal colónia do império.", gaps:[["europa","africa","asia","america"],["europa","africa","asia","america"],["europa","africa","asia","america"],["europa","africa","asia","america"],["crise"],["inglaterra","franca","holanda"],["inglaterra","franca","holanda"],["inglaterra","franca","holanda"],["piratas","de piratas","corsarios"],["naufragios"],["atlantico"],["brasil"]], group:{0:"c",1:"c",2:"c",3:"c",5:"p",6:"p",7:"p"}, exp:"Europa, África, Ásia, América; crise; Inglaterra, França, Holanda; piratas; naufrágios; Atlântico; Brasil."},
    {id:"a1b", type:"hotseq", q:"Legenda o engenho. Para cada palavra, clica no número certo da imagem.", img:"engenho-numerado.jpg", spots:[{n:"1",x:46,y:67},{n:"2",x:42,y:40},{n:"3",x:16,y:27},{n:"4",x:84,y:27}], seq:[{p:"Canavial",s:0},{p:"Casa grande (casa do senhor)",s:1},{p:"Sanzala",s:2},{p:"Engenho (fábrica do açúcar)",s:3}], exp:"1 – canavial; 2 – casa grande; 3 – sanzala; 4 – engenho."},
    {id:"a1c", type:"choice", q:"Observa o mapa. Que cor da legenda mostra que o Brasil foi fonte de grande riqueza no século XVIII (principais áreas mineiras)?", img:"mapa-brasil-seculo-xviii.jpg", opts:["Azul","Vermelho","Verde","Roxo"], ans:0, exp:"O azul marca as principais áreas mineiras. Vermelho e verde: captura de índios e procura de ouro pelos bandeirantes. Roxo: expedições contra índios que se revoltaram."},
    {id:"a1d", type:"choice", q:"No mesmo mapa, que cores mostram os bandeirantes à procura de índios para escravizar e de minas de ouro no sertão?", img:"mapa-brasil-seculo-xviii.jpg", opts:["Azul e roxo","Vermelho e verde","Só roxo","Laranja"], ans:1, exp:"Vermelho (captura de índios) e verde (procura de ouro)."},
    {id:"a1e", type:"open", q:"Observa a fotografia da seleção brasileira (2024) e o mapa da emigração e do tráfico. <b>Explica</b> de que modo as deslocações de população do século XVIII estão refletidas na fotografia.", imgs:["mapa-emigracao-trafico.jpg","selecao-brasileira.jpg"], groups:[{n:"descendentes de portugueses/europeus",k:["portugu","europe","colono","branc"]},{n:"descendentes de africanos escravizados",k:["africa","escrav","negr"]},{n:"mistura / mestiçagem / descendência",k:["mestic","mistur","descend","filhos","tons de pele","casament","cruzament","diferentes"]}], min:3, model:"A fotografia mostra jogadores brancos, negros e com diferentes tons de pele. Os brancos poderão descender dos portugueses que emigraram para o Brasil; os negros, das pessoas escravizadas levadas de África; os de outros tons de pele resultam da mistura entre descendentes de europeus, africanos e indígenas."}
   ]},
  {id:"A2", t:"Definir o poder absoluto",
   conceito:"<p>Na <b>monarquia absoluta</b> o rei reúne os <b>três poderes</b>: <b>legislativo</b> (fazer as leis), <b>executivo</b> (governar e mandar cumprir as leis) e <b>judicial</b> (julgar quem não as cumpre). O poder é <b>hereditário</b> (passa de pais para filhos) e <b>vitalício</b> (dura toda a vida).</p><p>Acreditava-se que o poder do rei tinha <b>origem divina</b>: «Deus no céu, o rei na terra». Os reis anteriores ainda reuniam as Cortes (D. João IV, 7 vezes); <b>D. João V nunca as reuniu</b>. O aumento dos impostos e o ouro do Brasil deram-lhe meios para controlar a nobreza com pensões e dádivas.</p>",
   termos:[["Poder legislativo","fazer as leis."],["Poder executivo","governar e fazer cumprir as leis."],["Poder judicial","julgar quem não cumpre as leis."],["Origem divina","ideia de que o poder do rei vem de Deus."],["Magnânimo","generoso, que gasta com grandeza (cognome de D. João V)."]],
   exemplo:"Imagina um jogo em que a mesma pessoa inventa as regras, joga e ainda é o árbitro. Ninguém lhe pode dizer que não: assim era o rei absoluto.",
   equivocos:["«Absoluto» não quer dizer que o rei fosse mau; quer dizer que o seu poder não tinha limites legais.","As Cortes não eram um tribunal: eram uma assembleia que aconselhava o rei."],
   ex:[
    {id:"a2a", type:"open", q:"<b>Define</b> monarquia absoluta.", img:"poderes-do-rei.jpg", groups:[{n:"o rei concentra todos os poderes",k:["todos os poderes","todo o poder","concentra","tres poderes","legislativ","executiv","judici"]},{n:"governa sem convocar as Cortes",k:["cortes","sem convocar","sem reunir","sozinho","sem ouvir","autorit"]},{n:"é hereditário e vitalício / origem divina",k:["heredit","vitalic","toda a vida","divin","deus"]}], min:2, model:"Regime político hereditário e vitalício em que o rei governa de forma autoritária, sem convocar Cortes, reunindo em si todos os poderes (legislativo, executivo e judicial)."},
    {id:"a2b", type:"tf", q:"Classifica e lê a correção das falsas.", items:[{t:"D. João V foi um rei absoluto.",v:true},{t:"A corte de D. João V era rica mas não luxuosa.",v:false,fix:"Era rica e luxuosa."},{t:"A corte de D. João V era animada com bailes e banquetes.",v:true},{t:"A origem da riqueza de D. João V era o ouro brasileiro.",v:true},{t:"D. João V mandou construir o Real Convento de Mafra.",v:true},{t:"D. João V construiu o Aqueduto das Águas Livres em Coimbra.",v:false,fix:"O Aqueduto das Águas Livres fica em Lisboa. Em Coimbra mandou fazer a Biblioteca Joanina."}]},
    {id:"a2c", type:"choice", q:"Lê: «O aumento dos impostos e o ouro do Brasil deram a D. João V os meios de controlar a nobreza, através de pensões e dádivas, <u>reforçando a sua autoridade acima de todos</u>.» (A. H. de Oliveira Marques). A frase sublinhada significa que D. João V foi um rei…", img:"reunioes-de-cortes.jpg", opts:["magnânimo","religioso","absoluto","com coroa"], ans:2, mis:{0:"m_cortes"}, exp:"Autoridade acima de todos = poder absoluto. «Magnânimo» é o cognome, não o tipo de poder."},
    {id:"a2d", type:"choice", q:"Observa o interior da igreja de São Francisco (Porto). Assinala a alínea <b>incorreta</b>.", img:"igreja-sao-francisco-porto.jpg", opts:["Na decoração do monumento foram usados azulejos e talha dourada.","O interior do monumento é barroco.","Foi graças ao ouro do Brasil que se fizeram decorações como esta.","O rei D. João V usou o ouro do Brasil sobretudo para desenvolver as atividades económicas."], ans:3, exp:"D. João V gastou o ouro em luxo, festas e construções; não desenvolveu a agricultura nem a indústria. Por isso o país empobreceu quando o ouro diminuiu."},
    {id:"a2e", type:"order", q:"Ordena os reis pelo número de vezes que reuniram Cortes, do <b>maior</b> para o <b>menor</b> (observa o quadro).", img:"reunioes-de-cortes.jpg", items:["D. João IV (7)","D. Afonso VI (3)","D. Pedro II (1)","D. João V (nenhuma)"], exp:"As Cortes foram reunidas cada vez menos, até deixarem de o ser: sinal do reforço do poder absoluto."}
   ]},
  {id:"A3", t:"A Inquisição e a sociedade",
   conceito:"<p>O <b>Tribunal do Santo Ofício</b> (Inquisição) chegou a Portugal em 1536. Era dirigido pelo <b>clero</b> e julgava quem fosse acusado de não respeitar a fé católica. Os acusados não sabiam quem os denunciara e podiam ser torturados.</p><p>As sentenças eram lidas no <b>auto de fé</b>, uma cerimónia pública com sermão, procissão e leitura das penas: prisão, perda de bens e, nos casos mais graves, morte na fogueira. As principais vítimas eram os <b>cristãos-novos</b>.</p>",
   termos:[["Heresia","crença contrária à doutrina da Igreja."],["Sentença","decisão de um tribunal."],["Cristão-velho","católico sem antepassados judeus ou muçulmanos."],["Intolerância religiosa","não aceitar outras crenças."]],
   exemplo:"Hoje, em Portugal, a Constituição garante a liberdade religiosa: ninguém pode ser perseguido pela sua religião. No século XVIII era muito diferente.",
   equivocos:["Os judeus «declarados» já não podiam viver em Portugal desde 1496–1497; por isso os perseguidos eram cristãos-novos.","A Inquisição não acabou com Pombal: ele reformou-a e pô-la sob o controlo do Estado. Só foi extinta em 1821."],
   ex:[

  {id:"A4", t:"Pombal: medidas, datas e números",
   conceito:"<p>Pombal quis tornar Portugal menos dependente da <b>Inglaterra</b>, a quem comprava muito mais do que vendia. Criou <b>companhias comerciais</b> e <b>indústrias</b> para produzir no país o que antes se <b>importava</b>.</p><p>Na sociedade, <b>perseguiu a nobreza e o clero</b> que se lhe opunham: em 1759 a família <b>Távora</b> foi executada após o atentado contra D. José I e os <b>jesuítas</b> foram expulsos. Valorizou a <b>burguesia</b> (o comércio passou a ser «profissão nobre», 1770). No ensino, criou escolas por todo o país (1772) e reformou a <b>Universidade de Coimbra</b>, com laboratórios e experiências.</p>",

    {id:"a4d", type:"open", q:"Observa o gráfico do comércio entre Portugal e a Inglaterra. Escreve um pequeno texto onde refiras: <b>o que está representado e o século</b>; <b>o significado das duas cores</b>; <b>como evoluíram as exportações e as importações</b>; <b>se as medidas de Pombal foram benéficas</b>.", img:"grafico-comercio-inglaterra.jpg", groups:[{n:"comércio Portugal–Inglaterra no século XVIII",k:["inglaterra","ingles","seculo xviii","sec. xviii","seculo 18","1706","1796"]},{n:"vermelho = exportações",k:["vermelh"]},{n:"azul = importações",k:["azul"]},{n:"as importações diminuíram (2.ª metade)",k:["importac"]},{n:"as exportações aumentaram",k:["exportac"]},{n:"medidas benéficas",k:["benefic","positiv","boas","resultad","melhor"]}], min:5, model:"O gráfico representa o comércio entre Portugal e a Inglaterra no século XVIII. O vermelho são as exportações (o que Portugal vendia aos ingleses) e o azul as importações (o que comprava). Até 1756 as importações subiram quase sempre. Depois de 1756 as importações desceram e as exportações subiram. Em 1796 os valores eram parecidos, o que mostra que as medidas de Pombal foram benéficas."}

var LABS = [
 {id:"L1", t:"Porque é que o Brasil ficou tão importante?", c:"imperio", steps:[
  {txt:"Pensa numa loja que vendia um produto muito caro (as especiarias do Oriente). De repente aparecem três lojas concorrentes ao lado (Holanda, Inglaterra, França) e ladrões no caminho (piratas). A loja perde clientes e dinheiro.", an:"Analogia: uma loja que perde clientes para a concorrência.", q:{q:"Na analogia, quem são as lojas concorrentes?", opts:["Holanda, Inglaterra e França","Brasil e Angola","Os piratas","Os jesuítas"], ans:0}, alt:{txt:"Vê de outra forma: no século XVII, outros países europeus quiseram também comerciar no Oriente e conquistaram territórios portugueses, como Ormuz, Malaca e Ceilão. Esses países eram a Holanda, a Inglaterra e a França.", q:{q:"Que países fizeram concorrência a Portugal no Oriente?", opts:["Holanda, Inglaterra e França","Brasil, Angola e Goa","Espanha e Itália"], ans:0}}},
  {txt:"O dono da loja muda de negócio: começa a vender açúcar, que produz numa grande quinta noutro sítio, o Brasil. Mais tarde encontra lá ouro. O negócio do Atlântico passa a dar mais lucro do que o do Oriente.", an:"Analogia: mudar para um negócio que dá mais lucro.", q:{q:"Que dois produtos tornaram o Brasil tão importante?", opts:["Açúcar e ouro","Especiarias e seda","Vinho e sal","Porcelana e tapetes"], ans:0}, alt:{txt:"Primeiro, no século XVII, o Brasil deu açúcar, produzido nos engenhos. Depois, no século XVIII, os bandeirantes encontraram ouro e diamantes. Açúcar e ouro foram as grandes riquezas.", q:{q:"No século XVIII, que nova riqueza do Brasil chegou a Lisboa em grandes quantidades?", opts:["Ouro","Pimenta","Seda"], ans:0}}}
 ]},
 {id:"L2", t:"Como funcionava um engenho?", c:"engenho", steps:[
  {txt:"Um engenho era como uma pequena aldeia-fábrica: tinha a plantação (canavial), a fábrica (moenda e caldeiras), a casa do dono (casa grande) e o alojamento dos trabalhadores escravizados (sanzala).", an:"Analogia: uma aldeia que é ao mesmo tempo quinta e fábrica.", q:{q:"Onde dormiam as pessoas escravizadas?", opts:["Na sanzala","Na casa grande","No canavial","Na moenda"], ans:0}, alt:{txt:"Lembra-te assim: a casa GRANDE era do senhor, o dono. A sanzala era um barracão onde as pessoas escravizadas dormiam amontoadas, muitas vezes no chão.", q:{q:"A casa grande era a casa…", opts:["do senhor do engenho","das pessoas escravizadas","dos missionários"], ans:0}}},
  {txt:"O açúcar seguia passos: cortar a cana → esmagá-la na moenda → cozer o caldo nas caldeiras → purgar (branquear) → encaixotar e enviar para a Europa.", an:"Analogia: uma receita com passos por ordem.", q:{q:"Qual é o passo logo a seguir a cortar a cana?", opts:["Esmagá-la na moenda","Encaixotar","Purgar o açúcar","Enviar para Lisboa"], ans:0}, alt:{txt:"Para tirar o sumo de uma laranja tens de a espremer primeiro. Com a cana é igual: primeiro esmaga-se na moenda para tirar o caldo.", q:{q:"Para que servia a moenda?", opts:["Para esmagar a cana e tirar o caldo","Para fundir ouro","Para guardar escravos"], ans:0}}},
  {txt:"Os indígenas resistiram, fugiram para o interior e morreram em grande número com doenças trazidas pelos europeus. Os colonos passaram a trazer pessoas escravizadas de África, em navios negreiros, através do Atlântico.", an:"Ideia-chave: o sentido do tráfico era África → Brasil.", q:{q:"Em que sentido viajavam os navios negreiros?", opts:["De África para o Brasil","Do Brasil para África","De Portugal para a Índia"], ans:0, mis:"m_trafico"}, alt:{txt:"Olha para o mapa: as setas do tráfico partem de Angola, da Guiné e de Moçambique e chegam ao Brasil. As pessoas eram arrancadas de África para trabalhar nos engenhos e nas minas do Brasil.", q:{q:"De onde eram arrancadas as pessoas escravizadas?", opts:["De África","Do Brasil","Da Ásia"], ans:0}}}
 ]},
 {id:"L3", t:"O quinto e as barras de ouro", c:"ouro", steps:[
  {txt:"«Quinto» quer dizer a quinta parte. Se divides uma pizza em 5 fatias iguais e dás 1 ao rei, deste-lhe o quinto. Em percentagem, é 20%.", an:"Analogia: uma pizza em 5 fatias.", q:{q:"Um mineiro extraiu 50 kg de ouro. Quantos quilos pertenciam ao rei?", opts:["10 kg","5 kg","25 kg","50 kg"], ans:0, mis:"m_quinto"}, alt:{txt:"Faz a conta por partes: 50 kg divididos por 5 dá 10 kg. Esses 10 kg eram do rei; o mineiro ficava com os outros 40 kg.", q:{q:"E se o mineiro extraísse 100 kg?", opts:["20 kg para o rei","5 kg para o rei","50 kg para o rei"], ans:0}}},
  {txt:"Muitas pessoas tentavam esconder ouro para não pagar o quinto: é o contrabando. Por isso o rei mandou fundir o ouro em barras com o escudo real, o ano e o peso. Uma barra sem selo era ouro ilegal.", an:"Analogia: o selo de garantia numa embalagem.", q:{q:"Para que servia o selo real nas barras?", opts:["Para provar que o imposto tinha sido pago e evitar o contrabando","Para as tornar mais pesadas","Para as enviar para o Oriente"], ans:0}, alt:{txt:"Pensa num bilhete de concerto com carimbo: o carimbo prova que pagaste. A barra com o escudo real provava que o quinto tinha sido pago ao rei.", q:{q:"Uma barra de ouro SEM o escudo real era provavelmente…", opts:["ouro de contrabando","ouro do rei","ouro falso"], ans:0}}}
 ]},
 {id:"L4", t:"Rei absoluto: três poderes numa só pessoa", c:"absolutismo", steps:[
  {txt:"Num jogo de futebol na escola há quem faça as regras, quem jogue e quem arbitre. Agora imagina que a mesma pessoa faz as três coisas. Ninguém a pode travar. Isto é o poder absoluto.", an:"Analogia: o dono da bola que também é árbitro.", q:{q:"Na analogia, «arbitrar» corresponde a que poder?", opts:["Judicial","Legislativo","Executivo"], ans:0}, alt:{txt:"Fazer as regras = poder legislativo (leis). Pôr as regras em prática = poder executivo (governar). Decidir quem as quebrou e castigar = poder judicial (julgar). O árbitro decide quem quebrou as regras.", q:{q:"Fazer as leis é o poder…", opts:["legislativo","judicial","executivo"], ans:0}}},
  {txt:"As Cortes eram uma reunião onde representantes do clero, da nobreza e do povo davam conselhos ao rei. Eram uma espécie de travão. D. João V nunca as reuniu: governou sem travão.", an:"Analogia: o conselho de turma que deixa de ser convocado.", q:{q:"Quantas vezes D. João V reuniu as Cortes?", opts:["Nenhuma","Sete","Três","Todos os anos"], ans:0, mis:"m_cortes"}, alt:{txt:"Olha para o quadro: D. João IV reuniu as Cortes 7 vezes, D. Afonso VI 3, D. Pedro II 1 e D. João V 0. O número foi diminuindo até desaparecer.", q:{q:"O que mostra a descida do número de Cortes?", opts:["Que o poder do rei ficou cada vez mais absoluto","Que o povo mandava mais","Que o rei estava doente"], ans:0}}},
  {txt:"Como pagava o rei para todos lhe obedecerem? Com o ouro do Brasil e os impostos: dava pensões e presentes aos nobres, que assim ficavam dependentes dele.", an:"Ideia-chave: quem paga, manda.", q:{q:"O que deu a D. João V os meios para controlar a nobreza?", opts:["O ouro do Brasil e o aumento dos impostos","As especiarias da Índia","Os votos do povo"], ans:0, mis:"m_oriente"}, alt:{txt:"O documento de Oliveira Marques diz: «O aumento dos impostos e o ouro do Brasil deram a D. João V os meios de controlar a nobreza». Procura sempre a resposta na fonte.", q:{q:"Segundo a fonte, os nobres eram controlados com…", opts:["pensões e dádivas","prisões","guerras"], ans:0}}}
 ]},
 {id:"L5", t:"Como reconhecer o barroco", c:"barroco", steps:[
  {txt:"Imagina que decoras a capa do teu caderno sem deixar nenhum espaço em branco: autocolantes dourados, curvas, brilhos. Os artistas barrocos tinham este «horror ao vazio».", an:"Analogia: um caderno decorado até ao último centímetro.", q:{q:"Qual destas imagens descreve melhor uma igreja barroca?", opts:["Paredes cobertas de talha dourada e azulejos","Paredes brancas e lisas","Estrutura de ferro e vidro"], ans:0, mis:"m_barroco"}, alt:{txt:"Barroco = exagero. Se olhas para dentro e vês ouro, curvas, anjos e colunas em espiral por todo o lado, é barroco. Se é simples e liso, não é.", q:{q:"Uma coluna em espiral chama-se…", opts:["coluna torsa","coluna lisa","coluna de ferro"], ans:0}}},
  {txt:"Estilo e encomenda são coisas diferentes. A Torre dos Clérigos é barroca, mas foi encomendada por uma irmandade do Porto. Mafra é barroca e foi encomendada por D. João V.", an:"Analogia: duas camisolas do mesmo estilo compradas por pessoas diferentes.", q:{q:"A Torre dos Clérigos é barroca. Foi mandada construir por D. João V?", opts:["Não","Sim"], ans:0, mis:"m_obras"}, alt:{txt:"As obras de D. João V que tens de saber são três: Palácio-Convento de Mafra, Aqueduto das Águas Livres (Lisboa) e Biblioteca Joanina (Coimbra). Tudo o resto, mesmo barroco, foi de outros.", q:{q:"Qual destas é uma obra de D. João V?", opts:["Biblioteca Joanina","Torre dos Clérigos","Mosteiro da Batalha"], ans:0}}}
 ]},
 {id:"L6", t:"Ordens, burguesia e Inquisição", c:"sociedade", steps:[
  {txt:"Pensa num prédio de três andares. Nos de cima (clero e nobreza) vivem os privilegiados, que não pagam condomínio (impostos). No rés-do-chão vive o povo, que paga tudo. A burguesia é um vizinho do rés-do-chão muito rico, com um apartamento luxuoso, mas que continua a pagar.", an:"Analogia: um prédio com andares privilegiados.", q:{q:"Em que «andar» estava a burguesia?", opts:["No do povo (não privilegiado)","No do clero","No da nobreza"], ans:0, mis:"m_burguesia"}, alt:{txt:"A pergunta-chave é: pagava impostos? O clero e a nobreza não; o povo sim. A burguesia pagava impostos, por isso fazia parte do povo, mesmo sendo rica.", q:{q:"A burguesia pagava impostos?", opts:["Sim","Não"], ans:0}}},
  {txt:"Para «subir de andar», o burguês precisava da autorização do dono do prédio: o rei, que lhe podia dar um título de nobreza como recompensa.", an:"Ideia-chave: só o rei nobilita.", q:{q:"Como podia um burguês tornar-se nobre?", opts:["Por decisão do rei","Comprando um palácio","Estudando muito"], ans:0, mis:"m_nascimento"}, alt:{txt:"Na sociedade de ordens, o nascimento decidia quase tudo. A exceção era o rei: só ele podia elevar alguém à nobreza, dando-lhe um brasão e um título (barão, visconde…).", q:{q:"Quem dava os títulos de nobreza?", opts:["O rei","O papa","As Cortes"], ans:0}}},
  {txt:"A Inquisição era um tribunal da Igreja. Quem mandava nela era o clero. As principais vítimas eram os cristãos-novos: descendentes de judeus que, em 1497, foram obrigados a tornar-se cristãos.", an:"Ideia-chave: tribunal da Igreja → clero.", q:{q:"Quem dirigia a Inquisição?", opts:["O clero","A nobreza","A burguesia"], ans:0, mis:"m_inquisicao"}, alt:{txt:"O nome completo é Tribunal do Santo Ofício: «santo» indica que pertencia à Igreja. Os juízes (inquisidores) eram padres e bispos.", q:{q:"O Tribunal do Santo Ofício pertencia…", opts:["à Igreja","ao exército","aos comerciantes"], ans:0}}}
 ]},
 {id:"L7", t:"Porque é que a Baixa resistiu melhor", c:"terramoto", steps:[
  {txt:"Uma cesta de vime dobra-se quando a apertas, mas não parte. Os prédios pombalinos têm dentro das paredes uma estrutura de madeira cruzada, a «gaiola», que abana com o sismo em vez de se desfazer.", an:"Analogia: a cesta de vime que dobra mas não parte.", q:{q:"Para que servia a gaiola pombalina?", opts:["Para os edifícios resistirem aos sismos","Para guardar pássaros","Para decorar as fachadas"], ans:0}, alt:{txt:"Antissísmico = contra os sismos. A gaiola de madeira dentro das paredes dava flexibilidade ao prédio: tremia sem cair.", q:{q:"«Antissísmico» quer dizer…", opts:["que resiste aos sismos","que é muito alto","que é feito de ferro"], ans:0}}},
  {txt:"A Lisboa antiga tinha ruas estreitas e tortas, onde o fogo passava de casa em casa e as pessoas ficavam presas. A nova Baixa tem ruas largas e retas, como um tabuleiro de xadrez, e paredes corta-fogo entre prédios.", an:"Analogia: um tabuleiro de xadrez.", q:{q:"Como eram as ruas da Lisboa pombalina?", opts:["Largas, retas e perpendiculares","Estreitas e irregulares","Em escadinhas"], ans:0, mis:"m_ruas"}, alt:{txt:"Compara: ANTES do terramoto, ruas estreitas e irregulares. DEPOIS, ruas largas e paralelas que se cruzam em ângulo reto, com passeios e esgotos.", q:{q:"As ruas estreitas e tortas eram da Lisboa…", opts:["anterior ao terramoto","pombalina"], ans:0}}}
 ]},

function $(s,r){ return (r||document).querySelector(s); }
function h(tag, p){ var el=document.createElement(tag); if(p) for(var k in p){ var v=p[k]; if(v==null) continue;
  if(k==="html") el.innerHTML=v; else if(k==="text") el.textContent=v; else if(k==="class") el.className=v;

function build(ex, body, st){

      var hits=0, wrong=0; btns.forEach(function(b,i){ var picked=st.sel.indexOf(i)>=0, good=ex.ans.indexOf(i)>=0;
        if(picked&&good){hits++; b.classList.add("ok");} else if(picked){wrong++; b.classList.add("bad"); if(ex.mis&&ex.mis[i]) mis.push(ex.mis[i]);} else if(good) b.classList.add("miss"); });

  }
  if(t==="imgpick"){
    st.sel=[];
    var bs = ex.imgs.map(function(im,i){ var b=h("button",{type:"button","aria-pressed":"false"}, h("img",{src:im.src, alt:im.cap}), h("span",{text:im.cap}));
